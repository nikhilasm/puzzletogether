<div id="template-root" class="container">
    <div class="row mb-4 text-center justify-content-center">
        <div class="col-auto">
            <p class="lead">Room Code:</p>
        </div>
        <div class="col-auto">
            <p class="lead text-decoration"><strong id="room-code"></strong></p>
        </div>
    </div>
    <div class="row mb-4 text-center">
        <div class="col-12">
            <ul class="list-group">
                <li class="list-group-item list-group-item-secondary"><strong>Players</strong></li>
            </ul>
            <ul id="players-list" class="list-group"></ul>
        </div>
    </div>
    <div class="row mb-4 text-center">
        <div class="col-12">
            <h4 class="text-success"><strong id="victory-text"></strong></h4>
        </div>
    </div>
    <div id="host-controls" class="mb-4"></div>
    <div class="row text-center">
        <div class="col-12">
            <button id="leave-button" class="btn btn-outline-danger" onclick="HANDLERS.leave()">Leave Room</button>
        </div>
    </div>
</div>
