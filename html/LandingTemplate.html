<div id="template-root" class="container">
    <div class="row text-center justify-content-center">
        <div class="col-auto">
            <p>
                A series of blanks will be shown and letters will be filled in one by one. Compete to 
                be the first to guess the word/phrase correctly! Points are awarded based on how many blanks
                are remaining when you correctly guess the phrase.
            </p>
        </div>
    </div>
    <div class="row text-center justify-content-center">
        <div class="col-auto">
            <button id="create-button" class="btn btn-outline-primary" onclick="HANDLERS.loadCreate()">Create Room</button>
        </div>
        <div class="col-auto">
            <button id="join-button" class="btn btn-outline-primary" onclick="HANDLERS.loadJoin()">Join Room</button>
        </div>
    </div>
</div>
