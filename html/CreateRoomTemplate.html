<div id="template-root" class="container">

    <div class="row mb-4">
        <div class="col-12">
            <label for="name-input" class="form-label">Name</label>
            <input id="name-input" class="form-control" aria-describedby="name-help"/>
            <div id="name-help" class="form-text">
                Your name can be anything you want!
            </div>
        </div>
    </div>
    <div class="row text-center justify-content-center">
        <div class="col-auto">
            <button id="back-button" class="btn btn-outline-primary" onclick="HANDLERS.loadLanding()">Back</button>
        </div>
        <div class="col-auto">
            <button id="submit-create-button" type="submit" class="btn btn-outline-primary" onclick="HANDLERS.create()">Create Room</button>
        </div>
    </div>
</div>
